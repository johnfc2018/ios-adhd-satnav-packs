name: Build a set of regions
# Builds several regions from one OSM extract (so their routing tiles come from a single graph build)
# and, if asked, publishes each as a release and updates the manifest the app reads.
on:
  schedule:
    - cron: "0 3 2 * *"   # monthly: rebuild the whole UK set from fresh OSM data and publish it
  workflow_dispatch:
    inputs:
      set:
        description: Set name from tools/sets (uk, isle-of-man-test)
        default: isle-of-man-test
      publish:
        description: Publish the regions to releases and the manifest
        type: boolean
        default: false
      only:
        description: Optional comma-separated region ids to package (the whole set is still built)
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install osmium
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -D /tmp/pmtiles
          tar -xzf /tmp/pmtiles/*.tar.gz -C /tmp/pmtiles
          sudo install /tmp/pmtiles/pmtiles /usr/local/bin/pmtiles
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the regions leave no gaps
        if: ${{ (inputs.set || 'uk') == 'uk' }}
        run: python3 tools/check_coverage.py tools/sets/uk.json
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          SET_NAME: ${{ inputs.set || 'uk' }}
          PUBLISH: ${{ github.event_name == 'schedule' && 'true' || inputs.publish }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(tools/build_set.py "tools/sets/$SET_NAME.json" --out out)
          if [ "$PUBLISH" = "true" ]; then args+=(--publish-repo "${{ github.repository }}"); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python3 "${args[@]}"
